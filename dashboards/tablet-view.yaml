# One view for a tablet or a wall screen: the list, the comparison and the branches side by side.
#
# Open the dashboard → ⋮ → "Edit dashboard" → ⋮ → "Raw configuration editor" → paste this under "views:"
# (keep the two-space indent of the other views) → Save.
- title: קניות
  path: shopping-tablet
  icon: mdi:cart-outline
  type: sections
  max_columns: 3
  dense_section_placement: true
  sections:
    - type: grid
      cards:
        - type: heading
          heading: הרשימה
          icon: mdi:format-list-checks
        - type: custom:shopping-compare-web-card
          view: list
          grid_options:
            columns: full

    - type: grid
      cards:
        - type: heading
          heading: השוואה
          icon: mdi:scale-balance
        - type: custom:shopping-compare-web-card
          view: compare
          grid_options:
            columns: full

    - type: grid
      cards:
        - type: heading
          heading: איפה הכי זול
          icon: mdi:trophy-outline
        - type: conditional
          conditions:
            - condition: state
              entity: binary_sensor.supermarket_site
              state: "off"
          card:
            type: markdown
            content: ⚠️ אין כרגע חיבור לאתר ההשוואה. מוצגת ההשוואה האחרונה.
        - type: tile
          entity: sensor.supermarket_cheapest_branch
          name: הכי זול
          grid_options:
            columns: 12
        - type: tile
          entity: sensor.supermarket_cheapest_total
          name: כל הרשימה
          grid_options:
            columns: 6
        - type: tile
          entity: sensor.supermarket_saving
          name: חיסכון
          grid_options:
            columns: 6
        - type: markdown
          content: |-
            {% set rows = states.sensor
              | selectattr('entity_id', 'match', 'sensor.supermarket_branch_')
              | selectattr('attributes.whole_list', 'defined')
              | sort(attribute='attributes.whole_list') | list %}
            {% if rows %}
            | סניף | כל הרשימה |
            |:--|--:|
            {% for s in rows -%}
            | {{ '🏆 ' if s.attributes.cheapest }}{{ s.attributes.branch }} | ₪{{ '%.2f' | format(s.attributes.whole_list) }} |
            {% endfor %}
            {% else %}
            ההשוואה תופיע כאן אחרי שתוסיפו מוצרים לרשימה.
            {% endif %}
        - type: tile
          entity: button.supermarket_compare_now
          name: השוואה עכשיו
          icon: mdi:refresh
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.supermarket_compare_now
          grid_options:
            columns: 12
        - type: statistics-graph
          title: לאורך זמן
          entities:
            - sensor.supermarket_cheapest_total
          stat_types:
            - mean
          period: day
          days_to_show: 30
          chart_type: line
